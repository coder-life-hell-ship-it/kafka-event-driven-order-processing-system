spring.application.name=notification-service
server.port=8083

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Consumer
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Consumer JSON
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.notificationservice.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.notificationservice.event.InventoryProcessedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Debug logging
logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka.clients.consumer=INFO

spring.kafka.listener.ack-mode=manual

# H2 Database
spring.datasource.url=jdbc:h2:file:./data/notificationdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console